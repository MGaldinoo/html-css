<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vídeo com HTML5</title>
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
</head>
<body>
    <h1>Inserindo vídeos hospedados localmente</h1>
    <p>Este vídeo está hospedado no meu próprio server</p>

 <!--POSTER - É A CAPA QUE FICARÁ DISPONÍVEL, ANTES DO VÍDEO COMEÇAR-->
    <video width="200px" controls poster="img/195217030.jpg">
        <source src="midia/Meu-video (1).mp4" type="video/mp4">
        <source src="midia/Meu-video (1).ogv" type="video/ogv">
        <source src="midia/Meu-video (1).web" type="video/web">
        <p> seu navegador não tem compatibilidade com reprodução de víodeo</p>

    </video>
    <h1>inserindo vídeo do Youtube</h1>
    <iframe 
    width="560" height="315" src="https://www.youtube.com/embed/OzUnqQk4eOg?si=guv1_qUcEne191Kz" title="YouTube video 
    player" frameborder="0" allow="accelerometer; autoplay; 
    clipboard-write; encrypted-media; gyroscope; picture-in-picture; 
    web-share" referrerpolicy="strict-origin-when-cross-origin"
     allowfullscreen>
    </iframe>
