<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Médias em HTML5</title>
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
</head>
<body>
    <h1>Imagem dinâmica</h1>
    <p>
        tente abrir esse siteem vários dispositivos 
        diferentes ou simplesmente
        aumente e diminua o tamanho do seu navegador
    </p>
    
    <picture>
        <source media="(max-width: 750px)" srcset="imagens/foto-p.png" type="image/png">
        <source media="(max-width: 1050px)" srcset="imagens/foto-m.png" type="image/png">
        <img src="imagens/foto-g.png" alt="imagens flex">
    </picture>

    <h1>Reproduzindo áudio </h1>
    <p>Vamos aprender a reproduzir audio</p>
    
    <!--MP3 WAV OGG FORMATOS-->


    <audio preload="metadata" autoplay controls>
        <source src="midia/Bounce It - Silent Partner.mp3" type="audio/mpeg">
        <source src="midia/Bounce It - Silent Partner.ogg" type="audio/ogg">
        <source src="midia/Bounce It - Silent Partner.wav" type="audio/wav">
        <p>Infelizmente o seu navegador não consegue reproduzir áudio. <a href="midia/Bounce It - Silent Partner.mp3"></a>Clique aqui para baixar o arquivo em MP3</p>
    </audio>

</body>
</html>
