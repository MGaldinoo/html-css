<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tags em HTML</title>
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
</head>
<body>
    <h1>Tags em HTML</h1>
    <p>
        Em HTML5 popdemos inserir elementos
        da lista a seguir. Passe o mouse sobre
        o termo para descobrir qual tag deverá 
        utilizar em cada caso.
    </p>

    <ul>
        <li><abbr title="use a tag <p>">Paragráfo</abbr></li>
        <li><abbr title="use a tag <h1> ..... até <h6>">Títulos</abbr></li>
        <li><abbr title="use a tag <img>">Imagens</abbr></li>
        <li><abbr title="use a tag <abbr>">Abreviações</abbr></li>
        <li><abbr title="use a tag <code>">Código-fonte</abbr></li>
        <li><abbr title="use a tag <ol> e <li>">Listas Numeradas</abbr></li>
        <li><abbr title="use a tag <ulg e <li>">Listas com demarcadores</abbr></li>

    </ul>

</body>
</html>
