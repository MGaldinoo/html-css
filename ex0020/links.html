<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links</title>
    <style>
        /* 
            #  = id
            .  = class
            :  = pseudo-class
            :: = pseudo-element
            >  = children (filho direto)
        */


        body{
            font-family: Arial, Helvetica, sans-serif;
        }
        
        a{
            color: red;
            text-decoration: none;
            font-weight: bold;
        }
        a:visited{
            color: darkred;
        }

        a:hover{
            color: black;
            text-decoration: underline;
        }

        a:active{
            color:yellow;
        }


        a::after{
            content:'(link)';
            text-decoration: none;
            font-weight: normal;
            color: darkgray;
        }
        
        
        .especial{
            background-color: red;
        }
        
        .especial::before {
            content: '⇒ ';
        }

        .especial::after {
            content: ' ⇐';
        }

    </style>
</head>
<body>
    <h1>Personalizando Links</h1>
    <ul>
        <li><a href="https://google.com" target="_blank">Repositório GITHUB</a> </li>
        <li><a href="www.youtube.com" target="_blank" class="especial">Canal do Youtube</a> </li>
        <li> <a href="www.cursoemvídeo.com.br" target="_blank" class="especial">Site do curso em vídeo</a></li>
    </ul>
</body>
</html>
